{% extends 'base.html' %}{% block content %}<header class="page-heading"><h1>البيانات والملفات</h1></header>
<section class="panel editor"><h2>جلب النسخة المنشورة</h2><p>استبدال كامل مع مراجعة وتراجع محلي؛ آخر نشر ناجح هو المعتمد.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="actions"><button name="action" value="fetch">مراجعة الجلب الكامل</button><button name="action" value="doctors_fetch" class="secondary">جلب الأطباء فقط</button><button name="action" value="undo" class="secondary">مراجعة التراجع عن الجلب</button></div></form></section>
{% if not is_demo %}
<section class="panel editor"><h2>تصدير محلي</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="actions"><button name="action" value="csv">CSV المرضى</button><button name="action" value="doctor_csv" class="secondary">CSV الأطباء</button></div></form></section>
<form method="post" class="panel editor"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="backup"><h2>نسخة احتياطية مشفرة .rpb</h2><label>كلمة المرور — 8 محارف على الأقل<input name="password" type="password" autocomplete="off" required minlength="8"></label><label>التأكيد<input name="confirmation" type="password" autocomplete="off" required></label><button>تصدير النسخة</button></form>
<form method="post" class="panel editor" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><h2>استعادة أو استيراد للقسم نفسه</h2><label>الملف<input name="file" type="file" accept=".rpb,.csv" required></label><label>كلمة مرور .rpb<input name="password" type="password" autocomplete="off"></label><div class="actions"><button name="action" value="restore">مراجعة استعادة .rpb</button><button name="action" value="import_csv" class="secondary">مراجعة CSV الحالي</button></div></form>
<form method="post" class="panel editor"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="join_export"><h2>تصدير ملف انضمام محمي — للمدير</h2><label>كلمة مرور جديدة — 10 محارف على الأقل<input name="password" type="password" autocomplete="off" required minlength="10"></label><button>تصدير .srjoin.json محمي</button></form>
{% endif %}{% endblock %}
