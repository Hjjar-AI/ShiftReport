{% extends 'base.html' %}{% block content %}<header class="page-heading"><h1>الترتيب المحفوظ</h1></header><form class="panel editor" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><p>يُحفظ ترتيب القائمة نفسه في CSV والتقارير. الأولوية أولاً.</p><label>نمط الترتيب<select name="preset"><option value="manual">يدوي</option><option value="name">الاسم</option><option value="admission">مدة القبول</option><option value="supervisor">فريق الاختصاصي</option><option value="workbook">ترتيب ملف Excel</option><option value="custom" selected>مستويات مخصصة</option></select></label>{% for index in range(5) %}{% set level=levels[index] if index<levels|length else {} %}<div class="form-grid"><label>المستوى {{ index+1 }}<select name="field"><option value="">دون مستوى</option>{% for field,label in fields.items() %}<option value="{{ field }}" {% if level.field==field %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>الاتجاه<select name="direction"><option value="ASC">تصاعدي</option><option value="DESC" {% if level.direction=='DESC' %}selected{% endif %}>تنازلي</option></select></label></div>{% endfor %}<button>حفظ الترتيب</button></form>{% endblock %}
