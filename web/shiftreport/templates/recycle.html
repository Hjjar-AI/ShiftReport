{% extends 'base.html' %}{% block content %}<header class="page-heading"><h1>سلة المحذوفات</h1></header>{% for item in records %}<section class="panel editor"><h2>{{ item.patient.name }}</h2><p class="multiline">{{ item.patient.initialDiagnosis }}</p><form method="post" data-confirm="استعادة المريض وكامل مهامه وشاراته محلياً؟"><input type="hidden" name="csrf" value="{{ csrf }}"><button name="key" value="{{ item.patient.externalId }}">استعادة</button></form></section>{% else %}<p class="panel empty">السلة فارغة.</p>{% endfor %}{% endblock %}
