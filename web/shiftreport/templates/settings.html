{% extends 'base.html' %}{% block content %}<header class="page-heading"><h1>إعدادات الوقت والتقارير</h1></header><form method="post" class="panel editor"><input type="hidden" name="csrf" value="{{ csrf }}"><label>المنطقة الزمنية لهذا الجهاز<input name="zone" value="{{ workspace.client.zone }}" dir="ltr" required list="zones"><datalist id="zones"><option value="Asia/Damascus"><option value="Asia/Beirut"><option value="Europe/London"><option value="UTC"></datalist></label><p>08:30 تحدد يوم التقرير المعروض فقط. لا تبدأ قسماً جديداً ولا تقفل التحرير. استخدم المنطقة نفسها على الأجهزة.</p><label>الصيغة الافتراضية<select name="format"><option value="pdf">PDF</option><option value="text" {% if preferences.get('format')=='text' %}selected{% endif %}>نص</option></select></label><label>التنسيق الافتراضي<select name="layout">{% for key,label in [('cards','بطاقات A5 بعمودين سريريين'),('table','جدول A5'),('paragraphs','فقرات A5')] %}<option value="{{ key }}" {% if preferences.get('layout')==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><p>لون PDF يتبع لون التطبيق. تقسيم المشرفين يُختار لكل تصدير محلي من صفحته.</p><button>حفظ الإعدادات</button></form>{% endblock %}
