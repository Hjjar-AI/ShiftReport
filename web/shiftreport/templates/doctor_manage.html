{% extends 'base.html' %}{% block content %}<header class="page-heading"><h1>إدارة الأطباء والفرق</h1></header>
<form class="panel editor" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><h2>إضافة أو تحرير</h2><label>العملية<select name="action"><option value="add">إضافة</option><option value="edit">تحرير</option><option value="delete">حذف</option><option value="promote">منح إدارة</option><option value="demote">إزالة إدارة</option><option value="transfer">نقل الإدارة الدائمة</option></select></label><label>الطبيب عند التحرير أو إجراء الصلاحيات<select name="key"><option value="">طبيب جديد</option>{% for key,d in doctors.items() %}<option value="{{ key }}">{{ d.name }}</option>{% endfor %}</select></label><div class="form-grid"><label>الاسم<input name="first"></label><label>الكنية<input name="last"></label><label>الجنس<select name="gender"><option value="M">ذكر</option><option value="F">أنثى</option></select></label><label>الدور<select name="clinicalRole"><option value="RESIDENT">مقيم</option><option value="SUPERVISOR">اختصاصي</option></select></label><label>معرّف تليجرام<input name="telegram_id" inputmode="numeric" autocomplete="off"></label><label>مجموعة تقارير الاختصاصي<input name="destination" autocomplete="off"></label><label>اختصاصي الفريق للمقيم<select name="teamSupervisorId"><option value="">دون فريق</option>{% for key,d in doctors.items() if d.clinicalRole=='SUPERVISOR' %}<option value="{{ key }}">{{ d.name }}</option>{% endfor %}</select></label></div><p>راجع كامل القيم عند التحرير. الألقاب المخصصة تبقى في التخزين ولا تظهر كعنصر تحرير.</p><button>مراجعة العملية</button></form>
<form class="panel editor" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="teams"><h2>عضوية الفريق</h2><label>المقيم<select name="resident">{% for key,d in doctors.items() if d.clinicalRole=='RESIDENT' %}<option value="{{ key }}">{{ d.name }}</option>{% endfor %}</select></label><label>الاختصاصي<select name="supervisor"><option value="">دون فريق</option>{% for key,d in doctors.items() if d.clinicalRole=='SUPERVISOR' %}<option value="{{ key }}">{{ d.name }}</option>{% endfor %}</select></label><button>مراجعة تغيير الفريق</button></form>
<form class="panel editor" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="import"><h2>استيراد CSV الأطباء الحالي</h2><input type="file" name="file" accept=".csv" aria-label="ملف CSV الأطباء" required><button>مراجعة الاستيراد</button></form>{% endblock %}
