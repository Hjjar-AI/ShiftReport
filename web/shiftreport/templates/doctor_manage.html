{% extends 'base.html' %}{% block content %}<header class="page-heading"><h1>إدارة الأطباء والفرق</h1></header>
<section class="panel editor"><h2>فتح سجل للتحرير</h2><div class="actions">{% for key,d in doctors.items() %}<a class="button secondary" href="{{ url_for('features.doctor_manage',key=key) }}">{{ d.name }}</a>{% endfor %}</div></section><form class="panel editor" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><h2>إضافة أو تحرير</h2><label>العملية<select name="action"><option value="add">إضافة</option><option value="edit" {% if existing %}selected{% endif %}>تحرير</option><option value="delete">حذف</option><option value="promote">منح إدارة</option><option value="demote">إزالة إدارة</option><option value="transfer">نقل الإدارة الدائمة</option></select></label><label>الطبيب عند التحرير أو إجراء الصلاحيات<select name="key"><option value="">طبيب جديد</option>{% for key,d in doctors.items() %}<option value="{{ key }}" {% if existing.uid==key %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label><div class="form-grid"><label>الاسم<input name="first" value="{{ first }}"></label><label>الكنية<input name="last" value="{{ last }}"></label><label>الجنس<select name="gender"><option value="M">ذكر</option><option value="F" {% if existing.gender=='F' %}selected{% endif %}>أنثى</option></select></label><label>الدور<select name="clinicalRole"><option value="RESIDENT">مقيم</option><option value="SUPERVISOR" {% if existing.clinicalRole=='SUPERVISOR' %}selected{% endif %}>اختصاصي</option></select></label><label>معرّف تليجرام<input name="telegram_id" inputmode="numeric" autocomplete="off" value="{{ existing.telegram_id or '' }}"></label><label>مجموعة تقارير الاختصاصي<input name="destination" autocomplete="off" value="{{ existing.destination or '' }}"></label><label>اختصاصي الفريق للمقيم<select name="teamSupervisorId"><option value="">دون فريق</option>{% for key,d in doctors.items() if d.clinicalRole=='SUPERVISOR' %}<option value="{{ key }}" {% if existing.teamSupervisorId==key %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label></div><p> الألقاب المخصصة تبقى في التخزين ولا تظهر كعنصر تحرير.</p><button>مراجعة العملية</button></form>
<form class="panel editor" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="teams"><h2>عضوية الفريق</h2><label>المقيم<select name="resident">{% for key,d in doctors.items() if d.clinicalRole=='RESIDENT' %}<option value="{{ key }}">{{ d.name }}</option>{% endfor %}</select></label><label>الاختصاصي<select name="supervisor"><option value="">دون فريق</option>{% for key,d in doctors.items() if d.clinicalRole=='SUPERVISOR' %}<option value="{{ key }}">{{ d.name }}</option>{% endfor %}</select></label><button>مراجعة تغيير الفريق</button></form>
<form class="panel editor" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="import"><h2>استيراد CSV الأطباء الحالي</h2><input type="file" name="file" accept=".csv" aria-label="ملف CSV الأطباء" required><button>مراجعة الاستيراد</button></form>{% endblock %}
