# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
# KSP's incremental cache reflects on FilterOutputStream.out on modular JDKs.
# Configure the Kotlin compiler daemon, where KSP runs, rather than only Gradle.
kotlin.daemon.jvmargs=--add-opens=java.base/java.io=ALL-UNNAMED

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.incremental=true
ksp.incremental=true
ksp.incremental.intermodule=true
