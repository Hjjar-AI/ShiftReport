import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Production runtime and build-plugin coordinates only; no suite scopes or upgrades.
gradle.projectsEvaluated {
    def application = gradle.rootProject.project(':app')
    application.tasks.register('ciDependencyInventory') {
        doLast {
            def scopes = []
            ['debugRuntimeClasspath', 'releaseRuntimeClasspath'].each { name ->
                def configuration = application.configurations.findByName(name)
                if (configuration == null || !configuration.canBeResolved) {
                    throw new GradleException("Missing production configuration: $name")
                }
                scopes.add([name: ":app:runtime:$name", configuration: configuration])
            }
            def processors = application.configurations.findAll {
                it.canBeResolved && it.name.toLowerCase().startsWith('ksp')
            }
            if (processors.isEmpty()) throw new GradleException('Missing KSP processor graph')
            processors.each { configuration ->
                scopes.add([name: ":app:processor:${configuration.name}", configuration: configuration])
            }
            gradle.rootProject.allprojects.sort { it.path }.each { project ->
                project.buildscript.configurations.findAll {
                    it.canBeResolved && it.name == 'classpath'
                }.each { configuration ->
                    scopes.add([name: "${project.path}:buildscript:classpath", configuration: configuration])
                }
            }
            def packages = [:]
            def populated = []
            scopes.each { scope ->
                def result = scope.configuration.incoming.resolutionResult
                if (result.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                    throw new GradleException("Incomplete resolution: ${scope.name}")
                }
                def count = 0
                result.allComponents.each { component ->
                    if (component.id instanceof ModuleComponentIdentifier) {
                        count++
                        def id = component.id
                        def key = "${id.group}:${id.module}:${id.version}".toString()
                        if (!packages.containsKey(key)) {
                            packages[key] = [name: "${id.group}:${id.module}".toString(), version: id.version, configurations: []]
                        }
                        packages[key].configurations.add(scope.name.toString())
                    }
                }
                if (count > 0) populated.add(scope.name.toString())
            }
            if (!populated.containsAll([':app:runtime:debugRuntimeClasspath', ':app:runtime:releaseRuntimeClasspath']) ||
                    !populated.any { it.contains(':buildscript:') }) {
                throw new GradleException('Production runtime/build-plugin inventory incomplete')
            }
            def destination = new File(gradle.rootProject.projectDir.parentFile, 'ci-output/dependencies/inventory.json')
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                configurations: scopes.collect { it.name.toString() },
                populatedConfigurations: populated,
                packages: packages.sort().values().toList()
            ])) + '\n'
        }
    }
}
