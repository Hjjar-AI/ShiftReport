name: 02 - Checks - Dependency vulnerabilities

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "false = skip; true = authorize Gradle production/plugin dependency resolution and public Maven queries to OSV, without upgrades or compilation. Default false."
        type: boolean
        default: false

permissions:
  contents: read

# Serialize Android work across all hosted workflow files, without cancellation.
concurrency:
  group: shiftreport-hosted-android
  cancel-in-progress: false

jobs:
  check:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
      - name: Run selected operation
        env:
          CI_OPERATION: dependencies
        run: python3 .github/scripts/hosted-android.py "$CI_OPERATION"
      - name: Query resolved public coordinates against OSV
        run: python3 .github/scripts/check-dependencies.py

      - name: Retain reports and diagnostics for one day
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/dependencies/
          retention-days: 1
          if-no-files-found: warn
