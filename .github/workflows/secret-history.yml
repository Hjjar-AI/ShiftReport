name: 13 - Checks - Production history secrets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'false = skip; true = download checksum-pinned Gitleaks and scan fetched production history, excluding suites/migrations/schemas. Counts only; no raw report upload. Default false.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full available history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan production history without publishing raw findings
        run: python3 .github/scripts/scan-history.py
