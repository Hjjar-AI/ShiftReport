name: 07 - Verify - Emulator with visual evidence
'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Options: false = skip; true = authorize debug build, required instrumentation build, emulator
          downloads and selected offline phases on API 23 and 35. Default: false. No physical devices or live Telegram.'
        type: boolean
        default: false
      operation:
        description: 'Options: capture = startup/demo PNGs and short video; instrumentation = selected existing
          offline demo and crypto tests; both = run both phases separately. Default: capture.'
        type: choice
        options:
        - capture
        - instrumentation
        - both
        default: capture
permissions:
  contents: read
concurrency:
  group: shiftreport-hosted-android
  cancel-in-progress: false
jobs:
  emulator:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api:
        - 23
        - 35
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare evidence directory
      run: mkdir -p ci-output/emulator
    - name: Set up Android tooling
      uses: ./.github/actions/setup-android
    - name: Build the current application without reserving a version
      run: python3 .github/scripts/hosted-android.py debug-apk
    - name: Build existing instrumentation only when selected
      if: ${{ inputs.operation != 'capture' }}
      run: python3 .github/scripts/hosted-android.py instrumentation-apk
    - name: Enable KVM on the ephemeral hosted runner
      shell: bash
      run: 'set -euo pipefail

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Capture the current startup and offline demo
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      env:
        CI_EXPECTED_API: ${{ matrix.api }}
        CI_AVD_NAME: shiftreport-ci-api${{ matrix.api }}
        CI_EMULATOR_OPERATION: ${{ inputs.operation }}
      with:
        api-level: ${{ matrix.api }}
        target: default
        arch: x86_64
        profile: pixel_2
        avd-name: shiftreport-ci-api${{ matrix.api }}
        emulator-port: 5554
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back
          none -camera-front none
        script: python3 .github/scripts/run-emulator.py
    - name: Retain visual evidence and failure diagnostics for one day
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: emulator-evidence-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha
          }}
        path: 'ci-output/emulator/

          ci-output/instrumentation/

          ci-output/debug-apk/

          ci-output/instrumentation-apk/

          '
        retention-days: 1
        if-no-files-found: error
