name: 00 - Checks - Workflow syntax

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'false = skip; true = download checksum-pinned actionlint and validate workflow YAML/shell. Default false. No Android build.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: bash .github/scripts/install-actionlint.sh
      - name: Prepare checksum-pinned YAML parser
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/ci-policy"
          "$RUNNER_TEMP/ci-policy/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/requirements-ci.txt
      - name: Enforce workflow safeguards
        run: '"$RUNNER_TEMP/ci-policy/bin/python" .github/scripts/check-ci-policy.py'
      - name: Validate workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/workflows
          actionlint -no-color 2>&1 | tee ci-output/workflows/actionlint.log
      - name: Retain diagnostics for one day
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/workflows/
          retention-days: 1
          if-no-files-found: warn
