name: 03 - Checks - Compilation and JVM

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "false = skip; true = authorize selected compilation or JVM test operation and dependency downloads. Default false."
        type: boolean
        default: false
      operation:
        description: "Options: compile-debug = production debug compilation; compile-release = production release compilation; jvm = existing full JVM suite with app/test compilation; all = both production variants and full JVM suite. Default: compile-debug."
        type: choice
        options: [compile-debug, compile-release, jvm, all]
        default: compile-debug

permissions:
  contents: read

# Serialize Android work across all hosted workflow files, without cancellation.
concurrency:
  group: shiftreport-hosted-android
  cancel-in-progress: false

jobs:
  check:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
      - name: Run selected operation
        env:
          CI_OPERATION: ${{ inputs.operation }}
        run: python3 .github/scripts/hosted-android.py "$CI_OPERATION"

      - name: Retain reports and diagnostics for one day
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/
          retention-days: 1
          if-no-files-found: warn
