name: 10 - Delivery - Signed clinical and demo APKs
'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Options: false = skip; true = authorize fresh clinical debug and demo APK builds and artifact signing, preserving stored version. Default: false. Keys must be configured first.'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: shiftreport-hosted-android
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Require declared signing readiness before building
      env:
        CI_SIGNING_READY: ${{ vars.SHIFTREPORT_DEBUG_SIGNING_READY }}
      run: test "$CI_SIGNING_READY" = true
    - name: Set up build tooling without signing secrets
      uses: ./.github/actions/setup-android
    - name: Build using the stored version
      run: |
        python3 .github/scripts/hosted-android.py debug-apk
        python3 .github/scripts/hosted-android.py demo-apk
    - name: Retain this run's signing input
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signing-input-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: ci-output/debug-apk/
        retention-days: 1
        if-no-files-found: error
    - name: Retain this run's demo signing input
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signing-input-demo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: ci-output/demo-apk/
        retention-days: 1
        if-no-files-found: error
    - name: Retain build diagnostics
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signing-build-log-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: |
          ci-output/debug-apk/gradle.log
          ci-output/demo-apk/gradle.log
        retention-days: 1
        if-no-files-found: warn
  sign:
    needs: build
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: debug-signing
    permissions:
      contents: read
      actions: read
    steps:
    - name: Check out signing tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Select JDK 21 without Gradle caches
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
      with:
        distribution: temurin
        java-version: '21'
    - name: Ensure pinned signing tools
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"'
    - name: Download signing input from this run and attempt only
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh run download "$GITHUB_RUN_ID" --name "signing-input-debug-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA" --dir ci-output/signing-input
        gh run download "$GITHUB_RUN_ID" --name "signing-input-demo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA" --dir ci-output/signing-input-demo
    - name: Sign and verify expected identity
      env:
        CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SHIFTREPORT_SIGN_KEYSTORE_BASE64: ${{ secrets.SHIFTREPORT_SIGN_KEYSTORE_BASE64 }}
        SHIFTREPORT_SIGN_KEY_ALIAS: ${{ secrets.SHIFTREPORT_SIGN_KEY_ALIAS }}
        SHIFTREPORT_SIGN_STORE_PASSWORD: ${{ secrets.SHIFTREPORT_SIGN_STORE_PASSWORD }}
        SHIFTREPORT_SIGN_KEY_PASSWORD: ${{ secrets.SHIFTREPORT_SIGN_KEY_PASSWORD }}
        SHIFTREPORT_SIGN_CERT_SHA256: ${{ vars.SHIFTREPORT_SIGN_CERT_SHA256 }}
      run: |
        python3 .github/scripts/sign-apk.py debug
        python3 .github/scripts/sign-apk.py demo
    - name: Retain verified public bundle only
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signed-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: ci-output/signed-debug/
        retention-days: 1
        if-no-files-found: error
    - name: Retain verified demo bundle
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signed-demo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: ci-output/signed-demo/
        retention-days: 1
        if-no-files-found: error
