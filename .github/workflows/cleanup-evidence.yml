name: 09 - Maintenance - Clear workflow runs and logs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'false = skip; true = authorize the selected preview or deletion. Default false. Deletion removes completed runs, attempts, logs and attached artifacts/APKs.'
        type: boolean
        default: false
      older_than_days:
        description: 'Integer 0-365; 0 = all completed runs, 1-365 = completed runs last updated more than that many days ago. Default 7.'
        type: number
        default: 7
        required: true
      scope:
        description: 'Options all-workflows = every workflow including Dependabot; emulator = workflow 07 only. Default all-workflows.'
        type: choice
        options: [all-workflows, emulator]
        default: all-workflows
      dry_run:
        description: 'true = preview only; false = delete eligible completed runs and attached artifacts/APKs after fresh ownership/status checks. Default true. Releases, caches and active runs are preserved.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup-ci-evidence
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out default-branch cleanup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Preview or clear completed runs
        env:
          CLEANUP_CONFIRM: ${{ format('{0}', inputs.confirm) }}
          CLEANUP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          CLEANUP_EVENT: ${{ github.event_name }}
          CLEANUP_DAYS: ${{ inputs.older_than_days }}
          CLEANUP_SCOPE: ${{ inputs.scope }}
          CLEANUP_DRY_RUN: ${{ format('{0}', inputs.dry_run) }}
        run: python3 .github/scripts/cleanup-ci-evidence.py
