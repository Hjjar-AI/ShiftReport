name: 06 - Build - Debug APK
'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Options: false = skip; true = authorize assembleDebug and downloads with stored version preserved
          and ephemeral debug signer. Default: false.'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: shiftreport-hosted-android
  cancel-in-progress: false
jobs:
  check:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Android tooling
      uses: ./.github/actions/setup-android
    - name: Run selected operation
      env:
        CI_OPERATION: debug-apk
      run: python3 .github/scripts/hosted-android.py "$CI_OPERATION"
    - name: Retain reports and diagnostics for one day
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: debug-apk-ephemeral-signer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: ci-output/debug-apk/
        retention-days: 1
        if-no-files-found: warn
