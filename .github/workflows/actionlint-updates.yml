name: 15 - Maintenance - Actionlint updates

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Options: false = skip; true = query stable upstream release metadata and write a proposed actionlint pin patch for review, without applying or executing it. Default: false.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  updates:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Propose a verified upstream pin change
        run: python3 .github/scripts/check-actionlint-update.py
      - name: Retain proposal for manual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actionlint-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/actionlint-update/
          retention-days: 1
          if-no-files-found: error
