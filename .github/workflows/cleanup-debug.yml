name: 14 - Maintenance - Debug release cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Options: false = skip; true = authorize selected debug Release/tag cleanup preview or deletion. Default: false.'
        type: boolean
        default: false
      preview:
        description: 'Options: true = preview only; false = delete eligible owned published debug Releases/assets and matching lightweight tags. Default: true.'
        type: boolean
        default: true
      older_than_days:
        description: 'Integer 1-365; retain Releases published or updated within that many days. Default: 30.'
        type: number
        default: 30
      keep:
        description: 'Integer 5 or greater; retain at least this many newest owned published debug Releases, plus all drafts and production Releases. Default: 5.'
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: shiftreport-hosted-android
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out trusted cleanup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Preview or clean owned debug Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_CONFIRM: ${{ format('{0}', inputs.confirm) }}
          CI_PREVIEW: ${{ format('{0}', inputs.preview) }}
          CI_DAYS: ${{ inputs.older_than_days }}
          CI_KEEP: ${{ inputs.keep }}
        run: python3 .github/scripts/cleanup-debug-releases.py
