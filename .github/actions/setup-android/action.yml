name: Set up ShiftReport Android tooling
description: Pinned JDK and cached Gradle with isolated hosted outputs and SDK 34
runs:
  using: composite
  steps:
    - name: Select hosted paths and verify source pins
      shell: bash
      run: python3 .github/scripts/hosted-android.py prepare
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up Gradle cache and validate wrapper
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
        cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}
    - name: Ensure pinned Android SDK packages
      shell: bash
      run: |
        set -euo pipefail
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
